<title>Árbol Novello Carlini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">

<style>
:root{
  --bg:#efedE8; --grid:#e5e2db; --card:#fffefb; --ink:#191c1a; --muted:#6b716d; --faint:#a4a9a5;
  --line:#d2cec5; --hair:#e7e4dc;
  --sicilia:#9b3350; --sicilia-soft:#f4e4e8;
  --friuli:#286b5c;  --friuli-soft:#e3efeb;
  --arg:#35566f;     --arg-soft:#e4ebf0;
  --open:#8a5514;    --open-soft:#f8eddb;
  --lift:0 1px 1px rgba(25,28,26,.04), 0 3px 8px -4px rgba(25,28,26,.18);
  --lift2:0 2px 4px rgba(25,28,26,.06), 0 16px 36px -20px rgba(25,28,26,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101312; --grid:#171b19; --card:#1a1f1d; --ink:#eceeeb; --muted:#98a09b; --faint:#666e69;
  --line:#2b322e; --hair:#222825;
  --sicilia:#e592a8; --sicilia-soft:#2a1a20;
  --friuli:#77c2ac;  --friuli-soft:#172a25;
  --arg:#8fb6d4;     --arg-soft:#16222b;
  --open:#dba764;    --open-soft:#2a2116;
  --lift:0 1px 1px rgba(0,0,0,.3), 0 3px 8px -4px rgba(0,0,0,.7);
  --lift2:0 2px 4px rgba(0,0,0,.4), 0 16px 36px -20px rgba(0,0,0,1);
}}
:root[data-theme="dark"]{
  --bg:#101312; --grid:#171b19; --card:#1a1f1d; --ink:#eceeeb; --muted:#98a09b; --faint:#666e69;
  --line:#2b322e; --hair:#222825;
  --sicilia:#e592a8; --sicilia-soft:#2a1a20;
  --friuli:#77c2ac;  --friuli-soft:#172a25;
  --arg:#8fb6d4;     --arg-soft:#16222b;
  --open:#dba764;    --open-soft:#2a2116;
  --lift:0 1px 1px rgba(0,0,0,.3), 0 3px 8px -4px rgba(0,0,0,.7);
  --lift2:0 2px 4px rgba(0,0,0,.4), 0 16px 36px -20px rgba(0,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Inter Tight",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:9px 16px;flex:none;flex-wrap:wrap;
  border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);z-index:30}
.brand{font-family:Fraunces,Georgia,serif;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button+button{border-left:1px solid var(--line)}
.tools{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--card);white-space:nowrap}
.sw{width:14px;height:9px;border-radius:2px;border:1px solid var(--muted);flex:none}
.sw.d{border-style:dashed}
.sw.h{border-style:dashed;border-color:var(--open);background:var(--open-soft)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 11px;
  font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--grid)}
input[type=search]{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:inherit;width:150px}

.body{flex:1;display:flex;min-height:0}
.vp{flex:1;position:relative;overflow:hidden;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:26px 26px;
  /* los gestos los maneja la app, no el navegador: sin esto el teléfono se
     queda con el pinch y con el tirón para recargar, y no llega nada acá */
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
.p,.sib{-webkit-tap-highlight-color:transparent}
.vp.drag{cursor:grabbing}
.world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.colhead{position:absolute;top:0;white-space:nowrap;pointer-events:none}
.colhead b{display:block;font-family:Fraunces,serif;font-size:12.5px;font-weight:500;color:var(--muted)}
.colhead span{display:block;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:1px}
.rotulo-suelto{position:absolute;white-space:nowrap;pointer-events:none;font-size:10.5px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--open);
  border:1px dashed var(--open);border-radius:999px;padding:2px 9px;background:var(--bg)}
svg.wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

.p{position:absolute;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:10px;padding:8px 11px;text-align:left;cursor:pointer;box-shadow:var(--lift);
  transition:opacity .18s,box-shadow .15s}
.p:hover{box-shadow:var(--lift2)}
.p:focus-visible{outline:2px solid var(--arg);outline-offset:3px}
.p.sel{box-shadow:0 0 0 2px var(--ink),var(--lift2)}
.p.mute{opacity:.18}
.p[data-b=sicilia]{border-left-color:var(--sicilia)}
.p[data-b=friuli]{border-left-color:var(--friuli)}
.p[data-b=arg]{border-left-color:var(--arg)}
.p.test{border-style:dashed;border-left-style:solid}
.p.open{border-style:dashed;border-left-style:solid;background:var(--open-soft)}
.p .nm{display:block;font-size:13.5px;font-weight:600;line-height:1.24}
.p .yr{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.p .pr{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;font-style:italic;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs{display:grid;gap:6px;margin-top:8px}
.doc{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;
  border:1px solid var(--hair);border-radius:9px;padding:8px 10px;background:var(--bg)}
.doc .tipo{font-size:12.5px;font-weight:600;grid-column:1/-1}
.doc .ref{font-size:11.5px;color:var(--muted);line-height:1.45;grid-column:1/-1}
.doc .est{font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:3px;
  justify-self:start;grid-column:1/-1;margin-top:2px}
.est-tengo{background:var(--friuli-soft);color:var(--friuli)}
.est-online{background:var(--arg-soft);color:var(--arg)}
.est-pedir{background:var(--open-soft);color:var(--open);border:1px dashed var(--open)}
.privado{font-size:11px;color:var(--faint);line-height:1.5;margin-top:8px;font-style:italic}
.p .tag{display:inline-block;margin-top:4px;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:1px 5px;border-radius:3px}
.tag.f{background:var(--open-soft);color:var(--open);border:1px solid var(--open)}
.tag.dc{background:var(--friuli-soft);color:var(--friuli)}
.cert{display:inline-block;margin-left:5px;font-style:normal;font-size:10px;line-height:1;
  width:13px;height:13px;border-radius:50%;text-align:center;vertical-align:1px;
  background:var(--friuli-soft);color:var(--friuli);border:1px solid var(--friuli)}
.shots{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.shot{display:block;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--bg);cursor:zoom-in}
.shot img{display:block;width:100%;height:110px;object-fit:cover;object-position:top}
.shot figcaption{font-size:10.5px;line-height:1.45;color:var(--faint);padding:6px 8px}
.lightbox{position:fixed;inset:0;background:rgba(10,12,11,.92);z-index:80;display:grid;
  place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:6px}
.srcurl{display:inline-block;margin-top:4px;font-size:11px;color:var(--arg);text-decoration:none;
  border-bottom:1px solid currentColor}
.pagina{position:absolute;inset:0;overflow-y:auto;background:var(--bg);z-index:25;padding:26px 22px 70px}
.pw{max-width:1120px;margin:0 auto}
.pagina h2{font-family:Fraunces,serif;font-size:26px;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
.pagina .intro{color:var(--muted);max-width:66ch;font-size:14.5px;line-height:1.6}
.mapa{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  box-shadow:var(--lift);overflow:hidden}
.mapa svg{display:block;width:100%;height:auto}
.rutas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:20px}
.ruta{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:13px 15px}
.ruta .via{font-size:12.5px;font-weight:600}
.ruta .quien{font-size:11px;color:var(--faint);margin-top:1px}
.ruta p{margin:7px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.ruta .año{float:right;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.hall{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:20px}
.h{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 17px}
.h h3{font-family:Fraunces,serif;font-size:16.5px;font-weight:500;margin:7px 0 7px;line-height:1.3}
.h p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.et{display:inline-block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px}
.et-hallazgo{background:var(--friuli-soft);color:var(--friuli)}
.et-negativo{background:var(--sicilia-soft);color:var(--sicilia)}
.et-muro{background:var(--grid);color:var(--muted)}
.et-proximo{background:var(--open-soft);color:var(--open)}
.et-hipotesis{background:transparent;color:var(--open);border:1px dashed var(--open)}
.nivel{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;font-size:11px;
  color:var(--faint);background:color-mix(in srgb,var(--bg) 82%,transparent);
  padding:4px 9px;border-radius:7px;z-index:20;font-variant-numeric:tabular-nums}

/* hermanos: presentes pero discretos, para que no compitan con la línea principal */
.sib{position:absolute;font-size:10px;line-height:1.5;color:var(--faint);cursor:pointer;
  background:none;border:0;padding:0 0 0 9px;text-align:left;white-space:nowrap;
  border-left:1px solid var(--hair);transition:color .12s,opacity .18s}
.sib:hover{color:var(--muted)}
.sib.mute{opacity:.18}
.sib b{font-weight:500}

.sheet{flex:none;width:0;overflow:hidden;transition:width .22s ease;
  border-left:1px solid var(--hair);background:var(--card);position:relative}
.sheet.on{width:372px}
@media (max-width:820px){
  .sheet{position:absolute;inset:auto 0 0 0;width:100%;height:0;transition:height .24s cubic-bezier(.22,1,.36,1);
    border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    box-shadow:0 -8px 40px -12px rgba(0,0,0,.35);z-index:40}
  .sheet.on{width:100%;height:min(66vh,560px)}
  .sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:99px;background:var(--line);z-index:3}
  .sheet-in{padding-top:26px}
  .x{top:16px}
}
.sheet-in{width:372px;max-width:100vw;height:100%;overflow-y:auto;padding:20px 22px 40px}
@media (max-width:820px){ .sheet-in{width:100%} }
.sheet h2{font-family:Fraunces,serif;font-size:21px;font-weight:500;line-height:1.15;margin:0;padding-right:36px}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.x{position:absolute;top:12px;right:14px;border:1px solid var(--line);background:var(--card);border-radius:9px;height:28px;padding:0 10px;cursor:pointer;color:var(--muted);z-index:2;font-size:12px;display:flex;align-items:center;gap:5px;box-shadow:var(--lift)}
.stamp{display:inline-block;margin-top:10px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px}
.st-doc{background:var(--friuli-soft);color:var(--friuli)}
.st-test{background:var(--grid);color:var(--muted)}
.st-hyp{background:var(--open-soft);color:var(--open)}
.note{margin-top:13px;font-size:13px;line-height:1.6;color:var(--muted);
  border-left:2px solid var(--line);padding-left:12px}
.sec{margin-top:20px}
.sec h3{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 8px}
.r{padding:8px 0;border-top:1px solid var(--hair)}
.r:first-of-type{border-top:0}
.r .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.r .v{font-size:13.5px;margin-top:2px;line-height:1.45}
.pick{display:inline-block;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
  background:var(--friuli-soft);color:var(--friuli);padding:1px 5px;border-radius:3px;margin-left:6px}
.why{margin-top:7px;font-size:12px;line-height:1.55;color:var(--muted);background:var(--bg);
  border-radius:8px;padding:8px 10px}
.cite{font-family:"JetBrains Mono",monospace;font-size:10px;line-height:1.55;color:var(--muted);
  margin-top:6px;padding-left:10px;border-left:1px solid var(--line);word-break:break-word}
.cite i{font-family:"Inter Tight",sans-serif;font-size:11px}
.kin{display:flex;flex-wrap:wrap;gap:5px}
.kin button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;
  font-size:12px;cursor:pointer}
.kin button:hover{background:var(--grid)}
.kin small{color:var(--faint)}
.reroot{margin-top:14px;width:100%;border:1px solid var(--line);background:var(--bg);
  border-radius:9px;padding:8px;font-size:12.5px;cursor:pointer}
.reroot:hover{background:var(--grid)}

.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:20}
.zoom button{width:33px;height:33px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;cursor:pointer;box-shadow:var(--lift)}
.hint{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--faint);z-index:20;
  background:color-mix(in srgb,var(--bg) 82%,transparent);padding:4px 9px;border-radius:7px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){
  .top{gap:8px;padding:7px 10px}
  .brand{font-size:14px;width:100%}
  .chip{display:none}                       /* la leyenda vive en Hallazgos */
  .tools{margin-left:0;width:100%;gap:6px}
  input[type=search]{flex:1;width:auto;min-width:0}
  .seg button{padding:7px 11px;font-size:13px}
  .btn{padding:7px 11px;font-size:13px}
  #roots{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
  #roots button{white-space:nowrap}
}
@media (max-width:520px){
  #hint{display:none}
  .brand{font-size:13.5px}
}
</style>

<script>
const ids=Object.keys(P);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const pa=id=>(P[id]?.pa||[]).filter(x=>P[x]);
const kids=id=>ids.filter(k=>(P[k].pa||[]).includes(id));
const yearOf=id=>{const m=P[id].d?.match(/\d{4}/);return m?+m[0]:9999;};
const hermanos=id=>{const s=new Set();
  pa(id).forEach(p=>kids(p).forEach(h=>{ if(h!==id) s.add(h); })); return [...s].sort((a,b)=>yearOf(a)-yearOf(b));};

/* ── Generación de cada persona, para poder ubicar las ramas sueltas ──
   Hay un grupo —los Cagnolin de Corfú— del que no sale ningún acta que lo ate
   al resto del árbol. Colgarlo de una línea inventada sería peor que dejarlo
   afuera; pero dejarlo sin dibujar es esconder el hallazgo más viejo que hay.
   Así que se dibuja aparte, en la columna que le corresponde por generación.
   Tres reglas simultáneas: el hijo va una generación después de sus padres,
   los dos padres comparten generación, y los hermanos también. */
const GEN=(()=>{
  const uf={}; ids.forEach(i=>uf[i]=i);
  const find=x=>uf[x]===x?x:(uf[x]=find(uf[x]));
  const une=(a,b)=>{const ra=find(a),rb=find(b); if(ra!==rb) uf[ra]=rb;};
  ids.forEach(id=>{const p=pa(id); for(let i=1;i<p.length;i++) une(p[0],p[i]);});
  ids.forEach(id=>{const c=kids(id); for(let i=1;i<c.length;i++) une(c[0],c[i]);});
  const out={}; ids.forEach(i=>out[find(i)]??=new Set());
  ids.forEach(id=>{const p=pa(id); if(!p.length) return;
    const a=find(p[0]), b=find(id); if(a!==b) out[a].add(b);});
  const g={}; Object.keys(out).forEach(k=>g[k]=0);
  for(let it=0; it<80; it++){
    let movio=false;
    for(const k of Object.keys(out)) for(const h of out[k]) if(g[h]<g[k]+1){g[h]=g[k]+1; movio=true;}
    for(const k of Object.keys(out)){ if(!out[k].size) continue;
      const m=Math.min(...[...out[k]].map(h=>g[h]))-1;
      if(m>g[k]){g[k]=m; movio=true;} }
    if(!movio) break;
  }
  const gen={}; ids.forEach(i=>gen[i]=g[find(i)]); return gen;
})();

const CW=196, CH=60, GX=78, GY=22, SIB=15;
/* Parentesco visto desde la raíz. Después de tatarabuelos el castellano se
   queda sin palabras de uso corriente, así que se numeran. */
const PARENTESCO=d=>['','Padres','Abuelos','Bisabuelos','Tatarabuelos',
  'Trastatarabuelos','4.os abuelos','5.os abuelos','6.os abuelos','7.os abuelos'][d]
  ?? (d+'.ª generación atrás');
const COLS_VIEJO=['','Padres','Abuelos','Bisabuelos','Tatarabuelos',
            '3.os abuelos','4.os abuelos','5.os abuelos','6.os abuelos'];

/* Alturas reales de cada tarjeta, medidas después de pintar. Una estimación
   nunca alcanza: basta que un nombre largo entre en dos líneas para que los
   hermanos terminen debajo de la caja. */
let medido={};
const world=document.getElementById('world'), wires=document.getElementById('wires'),
      layer=document.getElementById('layer'), heads=document.getElementById('heads'),
      vp=document.getElementById('vp');
let root='antonio', sel=null, X={}, Y={}, alto={}, dibujados=[];

/* ── el pedigrí: cada quien a la izquierda, sus padres a la derecha ── */
function build(){
  layer.innerHTML=''; wires.innerHTML=''; heads.innerHTML=''; X={}; Y={}; alto={}; dibujados=[];
  const puestos=new Set(); let cursor=54, maxD=0;

  // alto de la caja = la persona más sus hermanos en chiquito debajo
  /* La caja crece con lo que lleva adentro, así que la altura reservada tiene
     que contarlo: si el layout usa una constante y la tarjeta trae además la
     línea de profesión y una etiqueta, dos cajas terminan una encima de otra. */
  /* La caja crece con lo que lleva adentro: la línea de profesión y las
     etiquetas suman alto. Hay que medirla en un solo lugar, porque de esa
     altura dependen dos cosas distintas —cuánto espacio reserva el layout y
     dónde arrancan los hermanos— y si se calculan por separado se desfasan. */
  const estimado=id=>{const p=P[id];
    return CH+(p.pr?18:0)+((p.open||p.dc)?16:0);};
  const altoCaja=id=>medido[id]??estimado(id);
  const altoDe=id=>altoCaja(id)+(hermanos(id).length?hermanos(id).length*SIB+6:0);

  function poner(id,d){
    if(!P[id]||puestos.has(id)) return Y[id];
    puestos.add(id); maxD=Math.max(maxD,d);
    const ps=pa(id);
    if(!ps.length){ Y[id]=cursor; cursor+=altoDe(id)+GY; }
    else{
      const ys=ps.map(p=>poner(p,d+1)).filter(v=>v!==undefined);
      Y[id]=ys.length?(Math.min(...ys)+Math.max(...ys)+altoDe(ps[ps.length-1])-altoDe(id))/2
                     :(cursor+=altoDe(id)+GY, cursor-altoDe(id)-GY);
    }
    X[id]=40+d*(CW+GX); alto[id]=altoDe(id); dibujados.push(id);
    return Y[id];
  }
  poner(root,0);

  /* Lo que quedó sin dibujar: ramas que no cuelgan de la raíz. Se ubican en la
     columna que les toca por generación, debajo del árbol principal y con su
     propio rótulo, para que se vea que están y que todavía no están atadas. */
  const sueltos=new Set();
  /* Ojo con qué cuenta como "suelto". Sólo lo está quien no tiene NINGÚN camino
     hasta la raíz, ni siquiera bajando. Bernardo, sus hijos o los hermanos sí
     están conectados: lo que pasa es que este gráfico mira hacia atrás y ellos
     quedan hacia adelante. Meterlos en este pase los volvía a dibujar encima de
     alguien ya puesto, y encima con un rótulo que decía lo contrario de la
     verdad. Ellos se ven en la ficha; acá va sólo lo que de veras está suelto. */
  const conectado=(()=>{
    const ady=new Map(ids.map(k=>[k,new Set()]));
    ids.forEach(k=>pa(k).forEach(p=>{ady.get(k).add(p); ady.get(p).add(k);}));
    const vistos=new Set([root]), cola=[root];
    while(cola.length) for(const n of ady.get(cola.pop())||[]) if(!vistos.has(n)){vistos.add(n); cola.push(n);}
    return vistos;
  })();
  for(let vuelta=0; vuelta<12; vuelta++){
    // un hermano ya está dibujado aunque no tenga caja: va chiquito debajo del
    // suyo. Sin esto, cada hermano abría su propio bloque y los tres terminaban
    // apilados en la misma coordenada.
    const ya=new Set(puestos);
    [...puestos].forEach(i=>hermanos(i).forEach(h=>ya.add(h)));
    const faltan=ids.filter(i=>!ya.has(i)&&!conectado.has(i));
    if(!faltan.length) break;
    // el más reciente de los que faltan encabeza el bloque
    const cabeza=faltan.reduce((a,b)=>GEN[b]>GEN[a]?b:a);
    const d=GEN[root]-GEN[cabeza];
    if(d<0) break;
    cursor+=34;                       // aire entre el árbol y la rama suelta
    const tope=cursor;
    const antes=new Set(puestos);
    poner(cabeza,d);
    // los sueltos son exactamente los que entraron en esta pasada, ni uno más
    puestos.forEach(i=>{ if(!antes.has(i)) sueltos.add(i); });
    const r=document.createElement('div'); r.className='rotulo-suelto';
    r.style.left='40px'; r.style.top=(tope-26)+'px';
    r.textContent='rama sin conectar todavía — ningún acta la ata al resto';
    heads.appendChild(r);
  }

  const W=40+(maxD+1)*(CW+GX)+40;
  const H=Math.max(...dibujados.map(i=>Y[i]+alto[i]))+50;
  world.style.width=W+'px'; world.style.height=H+'px';
  wires.setAttribute('width',W); wires.setAttribute('height',H);

  /* El encabezado dice el parentesco RESPECTO DE QUIEN MIRA: si el árbol
     arranca en Antonio, la cuarta columna son sus bisabuelos; si arranca en
     Federico, son sus abuelos. Es el dato que uno quiere y cambia con la raíz. */
  for(let d=0;d<=maxD;d++){
    // los años de la columna cuentan sólo a los que sí cuelgan de la raíz:
    // decir que un Cagnolin de Corfú es tatarabuelo de Antonio sería mentir
    const ys=dibujados.filter(i=>X[i]===40+d*(CW+GX)&&!sueltos.has(i)).map(yearOf).filter(y=>y<9999);
    const h=document.createElement('div'); h.className='colhead';
    h.style.left=(40+d*(CW+GX))+'px'; h.style.top='14px';
    const a=ys.length?Math.min(...ys):null, b=ys.length?Math.max(...ys):null;
    h.innerHTML=`<b>${PARENTESCO(d)}</b>`+
      (ys.length?`<span>${a===b?a:a+'–'+b}</span>`:'');
    heads.appendChild(h);
  }

  /* La horquilla: un solo trazo del hijo al punto de bifurcación, la barra
     vertical que abarca a padre y madre, y de ahí un tramo corto a cada uno.
     Dibujado así se lee como UNA bifurcación, y no como dos líneas sueltas
     que casualmente se superponen. El punto en el vértice remata la unión. */
  const NS='http://www.w3.org/2000/svg';
  const traza=(d,color,dash,a,b)=>{
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    p.setAttribute('stroke',color); p.setAttribute('stroke-width','1.6');
    p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
    if(dash) p.setAttribute('stroke-dasharray',dash);
    p.dataset.a=a; p.dataset.b=b; wires.appendChild(p); return p;
  };
  dibujados.forEach(id=>{
    const ps=pa(id).filter(p=>X[p]!==undefined); if(!ps.length) return;
    const x1=X[id]+CW, y1=Y[id]+CH/2, mid=x1+GX*0.45;
    const hip=P[id].hyp;
    const color=hip?'var(--open)':'var(--line)';
    const dash=hip?'2 5':null;

    traza(`M${x1} ${y1} H${mid}`,color,dash,id,ps[0]);          // sale del hijo
    const ys=ps.map(p=>Y[p]+CH/2);
    if(ps.length>1) traza(`M${mid} ${Math.min(...ys)} V${Math.max(...ys)}`,color,dash,id,ps[0]);
    ps.forEach(p=>{
      const tst=!hip&&(P[id].t||P[p].t);
      traza(`M${mid} ${Y[p]+CH/2} H${X[p]}`,color,tst?'var(--line)':color,null,id,p)
        .setAttribute('stroke-dasharray',hip?'2 5':(tst?'5 4':'none'));
    });
    const dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',mid); dot.setAttribute('cy',y1); dot.setAttribute('r','2.6');
    dot.setAttribute('fill',hip?'var(--open)':'var(--muted)');
    dot.dataset.a=id; dot.dataset.b=ps[0]; wires.appendChild(dot);

    if(hip){ const t=document.createElementNS(NS,'text');
      t.setAttribute('x',mid+6); t.setAttribute('y',y1-6);
      t.setAttribute('fill','var(--open)'); t.setAttribute('font-size','9');
      t.setAttribute('font-family','Inter Tight,sans-serif'); t.textContent='HIPÓTESIS';
      t.dataset.a=id; t.dataset.b=ps[0]; wires.appendChild(t); }
  });

  dibujados.forEach(id=>{
    const p=P[id], b=document.createElement('button');
    b.className='p'+(p.open?' open':'')+(p.t&&!p.open?' test':'');
    b.dataset.b=p.b; b.dataset.id=id;
    b.style.cssText=`left:${X[id]}px;top:${Y[id]}px;width:${CW}px;min-height:${CH}px`;
    const cert = p.c?.length && !p.t && !p.hyp;
    b.innerHTML=`<span class="nm">${p.n}${cert?'<i class="cert" title="Respaldado por documentos">✓</i>':''}</span><span class="yr">${p.d}</span>`+
      (p.pr?`<span class="pr" title="${p.pr}">${p.pr}</span>`:'')+
      (p.open?'<span class="tag f">frontera</span>':'')+
      (p.dc?'<span class="tag dc">dante causa</span>':'');
    b.onclick=e=>{e.stopPropagation();show(id);};
    layer.appendChild(b);

    hermanos(id).forEach((h,i)=>{
      const s=document.createElement('button');
      s.className='sib'; s.dataset.id=h;
      s.style.cssText=`left:${X[id]+10}px;top:${Y[id]+altoCaja(id)+4+i*SIB}px;width:${CW-10}px`;
      s.innerHTML=`<b>${P[h].n}</b>${yearOf(h)<9999?' '+yearOf(h):''}`;
      s.title=`${P[h].n} · hermano/a de ${P[id].n}`;
      s.onclick=e=>{e.stopPropagation();show(h);};
      layer.appendChild(s);
    });
  });

  document.getElementById('hint').textContent=
    `${dibujados.length} antepasados de ${P[root].n.split(' ')[0]} · los nombres chiquitos son hermanos`;

  /* Segunda pasada: medir lo que se pintó y, si alguna tarjeta salió más alta
     que lo estimado, rehacer el layout con las medidas reales. Corre una sola
     vez —la segunda pasada ya tiene las medidas buenas— y el guard evita
     cualquier posibilidad de lazo. */
  if(!remidiendo){
    let cambio=false;
    layer.querySelectorAll('.p').forEach(el=>{
      const h=el.offsetHeight;
      if(Math.abs((medido[el.dataset.id]??0)-h)>1){ medido[el.dataset.id]=h; cambio=true; }
    });
    if(cambio){ remidiendo=true; build(); remidiendo=false; return; }
  }
  fit();
}
let remidiendo=false;

/* ── mover y acercar ── */
/* ── navegación ────────────────────────────────────────────────
   La rueda hacía zoom siempre, y eso pelea con el gesto que la mano ya tiene:
   en un trackpad, deslizar dos dedos es desplazarse. Ahora la rueda desplaza y
   el zoom se pide — con pinza, con Ctrl, o con los botones. Nadie vuelve a
   perder el árbol de vista por arrimar dos dedos.                            */
const K_MIN=.12, K_MAX=3.2;
let k=1,tx=0,ty=0, kObj=1,txObj=0,tyObj=0, anim=null;
const QUIETO=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=v=>Math.min(K_MAX,Math.max(K_MIN,v));
const pinta=()=>world.style.transform=`translate(${Math.round(tx*100)/100}px,${Math.round(ty*100)/100}px) scale(${k})`;
const nivel=document.getElementById('nivel');
function pinta2(){ pinta(); if(nivel) nivel.textContent=Math.round(k*100)+'%'; }

/* Un solo lazo de animación, y siempre el mismo. La versión anterior salía
   temprano si ya había uno corriendo y además dejaba que los movimientos
   instantáneos escribieran k mientras el lazo seguía vivo: los dos se pisaban
   y el resultado era ese temblor raro al hacer zoom. Ahora hay un único punto
   de verdad —el destino— y una sola función que lo alcanza. */
function corre(){
  if(anim) return;
  const paso=()=>{
    const e=.3;
    k+=(kObj-k)*e; tx+=(txObj-tx)*e; ty+=(tyObj-ty)*e;
    if(Math.abs(kObj-k)>.0004||Math.abs(txObj-tx)>.3||Math.abs(tyObj-ty)>.3){
      pinta2(); anim=requestAnimationFrame(paso);
    }else{ k=kObj; tx=txObj; ty=tyObj; pinta2(); anim=null; }
  };
  anim=requestAnimationFrame(paso);
}
function frena(){ if(anim){cancelAnimationFrame(anim); anim=null;} kObj=k; txObj=tx; tyObj=ty; }
function hacia(nk,ntx,nty,suave=true){
  kObj=clamp(nk); txObj=ntx; tyObj=nty;
  if(suave&&!QUIETO) corre();
  else { if(anim){cancelAnimationFrame(anim);anim=null;} k=kObj; tx=txObj; ty=tyObj; pinta2(); }
}
/* El zoom se ancla en un punto de la pantalla: ese punto no se mueve. Se calcula
   sobre el DESTINO, no sobre el estado actual, así varios pasos seguidos de
   rueda componen bien en vez de arrastrar el árbol. */
function zoomEn(nk,mx,my,suave=true){
  nk=clamp(nk);
  hacia(nk, mx-(mx-txObj)*(nk/kObj), my-(my-tyObj)*(nk/kObj), suave);
}
function fit(){
  const r=vp.getBoundingClientRect();
  const W=parseFloat(world.style.width), H=parseFloat(world.style.height);
  const nk=clamp(Math.min((r.width-70)/W,(r.height-70)/H,1.15));
  hacia(nk,(r.width-W*nk)/2,(r.height-H*nk)/2,false);
}
function centrarEn(id,nk){
  if(X[id]===undefined) return;
  const r=vp.getBoundingClientRect(); const z=clamp(nk??Math.max(kObj,.75));
  hacia(z, r.width/2-(X[id]+CW/2)*z, r.height/2-(Y[id]+CH/2)*z);
}

/* ── Rueda ──
   El problema en PC era éste: la rueda hacía pan. En un mouse común no hay
   deltaX, así que girar la rueda desplazaba el árbol hacia arriba y hacia abajo
   cuando lo que uno espera —en algo que se ve como un mapa— es acercarse.
   Ahora se distingue el aparato: el mouse manda saltos grandes y sin deltaX,
   el trackpad manda muchos deltas chicos y casi siempre con componente
   horizontal. Mouse: zoom al cursor. Trackpad: desplazar con dos dedos, y
   pellizcar para el zoom (el navegador manda ctrlKey en el pinch). */
let ultimaRueda=0, trackpad=false;
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;

  if(e.ctrlKey||e.metaKey){                       // pellizco del trackpad, o Ctrl+rueda
    zoomEn(kObj*Math.exp(-e.deltaY*0.012), mx, my);
    return;
  }
  if(e.shiftKey){                                 // desplazar en horizontal
    hacia(kObj, txObj-(e.deltaY||e.deltaX), tyObj);
    return;
  }
  // ¿mouse o trackpad? Un trackpad manda eventos seguidos, chicos y con deltaX.
  const ahora=performance.now();
  if(e.deltaX!==0 || (e.deltaMode===0 && Math.abs(e.deltaY)<40 && ahora-ultimaRueda<120)) trackpad=true;
  else if(e.deltaMode!==0 || Math.abs(e.deltaY)>=40) trackpad=false;
  ultimaRueda=ahora;

  if(trackpad){ hacia(kObj, txObj-e.deltaX, tyObj-e.deltaY, false); }
  else {
    const paso=e.deltaMode===0 ? e.deltaY/100 : e.deltaY;   // una muesca = un paso
    zoomEn(kObj*Math.pow(1.22,-paso), mx, my);
  }
},{passive:false});

/* ── Gestos ──
   Un solo puntero arrastra. Dos pellizcan: la escala sale de cómo cambia la
   distancia entre los dedos y el desplazamiento del punto medio entre ellos,
   que es lo que hace que el pellizco se sienta anclado donde uno lo agarró.
   Antes esto no existía: el código seguía un solo puntero, así que en el
   teléfono el segundo dedo no hacía nada y no había manera de acercarse.  */
const dedos=new Map();
let gesto=null, movio=false, vx=0, vy=0, ultimo=0, inercia=null;

const centro=()=>{const p=[...dedos.values()];
  return {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2, d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};};

function arranca(){
  const r=vp.getBoundingClientRect();
  frena();
  if(dedos.size===1){ const p=[...dedos.values()][0]; gesto={n:1,x:p.x,y:p.y,tx,ty}; }
  else if(dedos.size>=2){ const c=centro(); gesto={n:2,cx:c.x-r.left,cy:c.y-r.top,d:c.d,k,tx,ty}; }
}

vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.p,.sib')) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  if(inercia){cancelAnimationFrame(inercia); inercia=null;}
  dedos.set(e.pointerId,{x:e.clientX,y:e.clientY});
  movio=false; vx=vy=0; ultimo=performance.now();
  arranca();                                    // primero el estado del gesto
  vp.classList.add('drag');
  /* La captura es una comodidad, no un requisito: sirve para que el dedo
     pueda salirse del lienzo sin cortar el arrastre. Pero lanza si el puntero
     ya no existe, y si eso pasa antes de armar el gesto el arrastre no
     arranca nunca. Va última y entre paréntesis. */
  try{ vp.setPointerCapture(e.pointerId); }catch(_){}
});

vp.addEventListener('pointermove',e=>{
  if(!dedos.has(e.pointerId)) return;
  const prev=dedos.get(e.pointerId);
  dedos.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gesto) arranca();                         // por si el pointerdown se perdió
  if(!gesto) return;
  const r=vp.getBoundingClientRect();

  if(gesto.n===1&&dedos.size===1){
    const dx=e.clientX-gesto.x, dy=e.clientY-gesto.y;
    if(Math.hypot(dx,dy)>5) movio=true;
    /* Velocidad para la inercia. El piso de dt no puede ser 1ms: dos eventos
       muy juntos dan una velocidad enorme y el árbol sale disparado. Se toma
       un piso realista de cuadro y además se acota, porque ningún tirón de
       verdad mueve más de media pantalla por cuadro. */
    const ahora=performance.now(), dt=Math.max(8,ahora-ultimo), TOPE=55;
    const nvx=(e.clientX-prev.x)/dt*16, nvy=(e.clientY-prev.y)/dt*16;
    vx=Math.max(-TOPE,Math.min(TOPE,nvx)); vy=Math.max(-TOPE,Math.min(TOPE,nvy));
    ultimo=ahora;
    tx=txObj=gesto.tx+dx; ty=tyObj=gesto.ty+dy; pinta2();
  }
  else if(dedos.size>=2){
    if(gesto.n!==2) arranca();
    const c=centro();
    movio=true;
    const nk=clamp(gesto.k*(c.d/gesto.d));
    const cx=c.x-r.left, cy=c.y-r.top;
    // el punto agarrado se queda quieto, y además el par de dedos puede desplazar
    tx=txObj=cx-(gesto.cx-gesto.tx)*(nk/gesto.k);
    ty=tyObj=cy-(gesto.cy-gesto.ty)*(nk/gesto.k);
    k=kObj=nk; pinta2();
  }
},{passive:true});

function suelta(e){
  if(!dedos.has(e.pointerId)) return;
  dedos.delete(e.pointerId);
  if(dedos.size>=1){ arranca(); return; }          // quedaba un dedo: rebasar, sin salto
  gesto=null; vp.classList.remove('drag');
  // inercia: sólo si el tirón fue de verdad
  if(!QUIETO && Math.hypot(vx,vy)>4){
    const paso=()=>{
      vx*=.94; vy*=.94;
      tx=txObj=tx+vx; ty=tyObj=ty+vy; pinta2();
      inercia=(Math.hypot(vx,vy)>0.4)?requestAnimationFrame(paso):null;
    };
    inercia=requestAnimationFrame(paso);
  }
}
vp.addEventListener('pointerup',suelta);
vp.addEventListener('pointercancel',suelta);

/* Doble toque para acercar. En el teléfono el dblclick del navegador llega
   tarde y a veces no llega, así que se detecta a mano. */
let ultimoToque=0, ultimoXY=null;
vp.addEventListener('pointerup',e=>{
  if(e.target.closest('.p,.sib')) return;
  const ahora=performance.now(), r=vp.getBoundingClientRect();
  const cerca=ultimoXY&&Math.hypot(e.clientX-ultimoXY[0],e.clientY-ultimoXY[1])<32;
  if(ahora-ultimoToque<300 && cerca && !movio){
    zoomEn(kObj<1?Math.min(1.4,kObj*2.2):kObj/2.2, e.clientX-r.left, e.clientY-r.top);
    ultimoToque=0; return;
  }
  ultimoToque=ahora; ultimoXY=[e.clientX,e.clientY];
});
vp.addEventListener('dblclick',e=>{ const c=e.target.closest('.p');
  if(c) centrarEn(c.dataset.id,1.3); });

/* La hoja de abajo se cierra tirándola hacia abajo, como cualquier app. */
(function hojaMovil(){
  const sh=document.getElementById('sheet'); if(!sh) return;
  let y0=null, dy=0;
  sh.addEventListener('pointerdown',e=>{
    if(innerWidth>820) return;
    if(e.target.closest('button,a,.shot,input')) return;
    if(sheetIn.scrollTop>0) return;                 // si está scrolleado, primero se scrollea
    y0=e.clientY; dy=0; sh.style.transition='none';
  });
  sh.addEventListener('pointermove',e=>{
    if(y0===null) return;
    dy=Math.max(0,e.clientY-y0);
    sh.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  const fin=()=>{
    if(y0===null) return;
    sh.style.transition=''; sh.style.transform='';
    if(dy>90) cerrar();
    y0=null;
  };
  sh.addEventListener('pointerup',fin); sh.addEventListener('pointercancel',fin);
})();

document.getElementById('zin').onclick=()=>{const r=vp.getBoundingClientRect();
  zoomEn(kObj*1.35,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=vp.getBoundingClientRect();
  zoomEn(kObj/1.35,r.width/2,r.height/2);};
document.getElementById('fit').onclick=fit;

addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  const P_=e.shiftKey?320:110, r=vp.getBoundingClientRect();
  if(e.key==='ArrowLeft'){ hacia(kObj,txObj+P_,tyObj); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ hacia(kObj,txObj-P_,tyObj); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ hacia(kObj,txObj,tyObj+P_); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ hacia(kObj,txObj,tyObj-P_); e.preventDefault(); }
  else if(e.key==='+'||e.key==='='){ zoomEn(kObj*1.35,r.width/2,r.height/2); e.preventDefault(); }
  else if(e.key==='-'||e.key==='_'){ zoomEn(kObj/1.35,r.width/2,r.height/2); e.preventDefault(); }
  else if(e.key==='0'){ fit(); e.preventDefault(); }
});
addEventListener('resize',()=>{ if(kObj<=.2) fit(); });

/* ── ficha ── */
const sheet=document.getElementById('sheet'), sheetIn=document.getElementById('sheetIn');
function show(id){
  sel=id;
  const linea=new Set([id]); let q=[id];
  while(q.length){const c=q.pop(); pa(c).forEach(p=>{if(!linea.has(p)){linea.add(p);q.push(p);}});}
  q=[id];
  while(q.length){const c=q.pop(); kids(c).forEach(x=>{if(!linea.has(x)){linea.add(x);q.push(x);}});}
  document.querySelectorAll('.p,.sib').forEach(n=>{
    n.classList.toggle('sel',n.classList.contains('p')&&n.dataset.id===id);
    n.classList.toggle('mute',!linea.has(n.dataset.id));});
  wires.querySelectorAll('path,text,circle').forEach(w=>
    w.style.opacity=(linea.has(w.dataset.a)&&linea.has(w.dataset.b))?1:.12);

  const p=P[id];
  const stamp=p.hyp?'<span class="stamp st-hyp">vínculo hipotético</span>'
    :p.t?'<span class="stamp st-test">sólo por testimonio familiar</span>'
    :p.c?.length?'<span class="stamp st-doc">documentado</span>':'';
  const col = X[id]!==undefined ? Math.round((X[id]-40)/(CW+GX)) : null;
  const rel = col===0 ? '' : col>0 ? ' · ' + PARENTESCO(col).replace(/s$/,'').toLowerCase() + ' de ' + P[root].n.split(' ')[0] : '';
  let h=`<h2>${p.n}</h2><div class="sub">${p.d}${rel}</div>`+
    (p.pr?`<div class="sub" style="font-style:italic">${p.pr}</div>`:'')+stamp;
  if(!dibujados.includes(id))
    h+=`<button class="reroot" data-root="${id}">Ver la ascendencia de ${p.n.split(' ')[0]}</button>`;
  if(p.note) h+=`<div class="note">${p.note}</div>`;
  if(p.f?.length){ h+='<div class="sec"><h3>Datos</h3>';
    p.f.forEach(([kk,v,w,ok])=>h+=`<div class="r"><div class="k">${kk}</div>`+
      `<div class="v">${v}${ok?'<span class="pick">aceptada</span>':''}</div>`+
      (w?`<div class="why">${w}</div>`:'')+'</div>'); h+='</div>'; }
  if(p.c?.length){ h+='<div class="sec"><h3>Fuentes</h3>';
    p.c.forEach(([c,q2])=>h+=`<div class="cite">${c}${q2?`<br><i>“${q2}”</i>`:''}</div>`);
    if(p.url) h+=`<a class="srcurl" href="${p.url}" target="_blank" rel="noopener">Ver el registro original ↗</a>`;
    h+='</div>'; }
  if(p.docs?.length){
    const nom={tengo:'lo tenemos',online:'está online',pedir:'hay que pedirlo'};
    h+='<div class="sec"><h3>Documentos</h3><div class="docs">';
    p.docs.forEach(([tipo,ref,est])=>h+=
      `<div class="doc"><span class="tipo">${esc(tipo)}</span><span class="ref">${esc(ref)}</span>`+
      `<span class="est est-${est}">${nom[est]||est}</span></div>`);
    h+='</div>';
    if(p.docs.some(x=>x[2]==='tengo'))
      h+='<p class="privado">Los escaneos de estos documentos no se publican acá: contienen datos personales de gente viva. Están en el árbol privado, al que se entra con cuenta de Google.</p>';
    h+='</div>'; }
  if(p.img?.length){ h+='<div class="sec"><h3>Del registro</h3><div class="shots">';
    p.img.forEach(([src,cap])=>h+=`<figure class="shot" data-full="${src}"><img src="${src}" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption></figure>`);
    h+='</div></div>'; }
  const kin=[];
  pa(id).forEach(x=>kin.push([x,'padre/madre']));
  hermanos(id).forEach(x=>kin.push([x,'hermano/a']));
  const par=new Set(); kids(id).forEach(c=>pa(c).forEach(x=>{if(x!==id)par.add(x);}));
  [...par].forEach(x=>kin.push([x,'pareja']));
  kids(id).sort((a,b)=>yearOf(a)-yearOf(b)).forEach(x=>kin.push([x,'hijo/a']));
  if(kin.length){ h+='<div class="sec"><h3>Familia</h3><div class="kin">';
    kin.forEach(([x,r])=>h+=`<button data-go="${x}">${P[x].n} <small>· ${r}</small></button>`);
    h+='</div></div>'; }
  sheetIn.innerHTML=h; sheet.classList.add('on');
  sheetIn.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
  sheetIn.querySelectorAll('.shot').forEach(f=>f.onclick=()=>{
    const lb=document.createElement('div'); lb.className='lightbox';
    lb.innerHTML='<img src="'+f.dataset.full+'" alt="">';
    lb.onclick=()=>lb.remove();
    addEventListener('keydown',function esc(ev){ if(ev.key==='Escape'){lb.remove();removeEventListener('keydown',esc);} });
    document.body.appendChild(lb); });
  sheetIn.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>{
    root=b.dataset.root; syncRoots(); build(); show(root);});
}
function cerrar(){
  sheet.classList.remove('on'); sel=null;
  document.querySelectorAll('.p,.sib').forEach(n=>n.classList.remove('sel','mute'));
  wires.querySelectorAll('path,text,circle').forEach(w=>w.style.opacity=1);
}
document.getElementById('x').onclick=cerrar;
addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });
// clic en el vacío cierra la ficha; arrastrar, no
vp.addEventListener('pointerup',e=>{ if(!e.target.closest('.p,.sib') && !movio) cerrar(); });
function syncRoots(){ document.querySelectorAll('#roots button').forEach(b=>
  b.setAttribute('aria-pressed',String(b.dataset.r===root))); }
document.querySelectorAll('#roots button').forEach(b=>b.onclick=()=>{
  root=b.dataset.r; syncRoots(); build(); });
document.getElementById('q').oninput=e=>{
  const s=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.p,.sib').forEach(n=>
    n.classList.toggle('mute', !!s && !P[n.dataset.id].n.toLowerCase().includes(s)));
};
build();
</script>

<script>
/* ═══════════ vista de rutas: por dónde se movió la familia ═══════════ */
const RAMA_COLOR={friuli:'var(--friuli)',sicilia:'var(--sicilia)',comun:'var(--arg)',puerto:'var(--muted)'};

function dibujarMapa(){
  const IT=LUGARES.filter(l=>l.pais==='it'), AR=LUGARES.filter(l=>l.pais==='ar');
  // cada país en su propio recuadro, con sus coordenadas reales proyectadas adentro
  const caja=(pts,x0,y0,w,h)=>{
    const la=pts.map(p=>p.lat), lo=pts.map(p=>p.lon);
    const laMin=Math.min(...la),laMax=Math.max(...la),loMin=Math.min(...lo),loMax=Math.max(...lo);
    const m={};
    pts.forEach(p=>m[p.id]={
      x:x0+ (loMax===loMin?w/2: (p.lon-loMin)/(loMax-loMin)*w),
      y:y0+ (laMax===laMin?h/2: (laMax-p.lat)/(laMax-laMin)*h)});
    return m;
  };
  const W=1120,H=560;
  const pos={...caja(IT,90,70,300,420), ...caja(AR,700,110,300,360)};

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de los movimientos de la familia">`;
  s+=`<rect x="60" y="40" width="360" height="480" rx="16" fill="var(--bg)" stroke="var(--hair)"/>`;
  s+=`<rect x="670" y="80" width="360" height="420" rx="16" fill="var(--bg)" stroke="var(--hair)"/>`;
  s+=`<text x="240" y="30" text-anchor="middle" font-family="Fraunces,serif" font-size="15" fill="var(--muted)">Italia</text>`;
  s+=`<text x="850" y="70" text-anchor="middle" font-family="Fraunces,serif" font-size="15" fill="var(--muted)">Argentina</text>`;
  s+=`<text x="545" y="270" text-anchor="middle" font-size="10.5" fill="var(--faint)" letter-spacing="1.5">EL ATLÁNTICO</text>`;
  s+=`<text x="545" y="288" text-anchor="middle" font-size="9.5" fill="var(--faint)">unos 11.000 km · tres semanas de barco</text>`;

  RUTAS.forEach(r=>{
    const a=pos[r.de], b=pos[r.a]; if(!a||!b) return;
    const l=LUGARES.find(x=>x.id===r.a);
    const col=RAMA_COLOR[l.rama]||'var(--muted)';
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2-Math.min(90,Math.abs(b.x-a.x)*0.22+18);
    s+=`<path d="M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}" fill="none" stroke="${col}"
         stroke-width="1.6" opacity=".55"${r.firme?'':' stroke-dasharray="4 4"'}/>`;
    s+=`<text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="9.5" fill="${col}"
         opacity=".9" font-variant-numeric="tabular-nums">${esc(r.año)}</text>`;
  });

  LUGARES.forEach(l=>{
    const p=pos[l.id]; if(!p) return;
    const col=RAMA_COLOR[l.rama]||'var(--muted)';
    const derecha = l.pais==='ar';
    s+=`<circle cx="${p.x}" cy="${p.y}" r="5" fill="${col}"/>`;
    s+=`<circle cx="${p.x}" cy="${p.y}" r="10" fill="${col}" opacity=".14"/>`;
    s+=`<text x="${p.x+(derecha?12:-12)}" y="${p.y+4}" text-anchor="${derecha?'start':'end'}"
         font-size="11.5" font-weight="500" fill="var(--ink)">${esc(l.n)}</text>`;
  });
  s+='</svg>';
  return s;
}

function pintarRutas(){
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let h=`<div class="pw"><h2>Por dónde se movió la familia</h2>
   <p class="intro">Dos migraciones que arrancaron a mil quinientos kilómetros una de otra —el
   Friuli en el extremo noreste, Sicilia en el sur— y terminaron en el mismo partido del conurbano
   bonaerense. Las líneas punteadas son los tramos que sabemos por testimonio pero no por documento.</p>
   <div class="mapa">${dibujarMapa()}</div><div class="rutas">`;
  RUTAS.forEach(r=>{
    const A=LUGARES.find(x=>x.id===r.de), B=LUGARES.find(x=>x.id===r.a);
    h+=`<div class="ruta"><span class="año">${esc(r.año)}</span>
      <div class="via">${esc(A.n)} → ${esc(B.n)}</div>
      <div class="quien">${esc(r.quien)}${r.firme?'':' · sin documento'}</div>
      <p>${esc(r.texto)}</p></div>`;
  });
  h+='</div><div class="rutas" style="margin-top:22px">';
  LUGARES.forEach(l=>{ h+=`<div class="ruta"><div class="via">${esc(l.n)}</div>
     <p>${esc(l.nota)}</p></div>`; });
  return h+'</div></div>';
}

function pintarHallazgos(){
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const nombre={hallazgo:'hallazgo',negativo:'negativo verificado',hipotesis:'hipótesis',muro:'el muro',proximo:'próximo paso'};
  let h=`<div class="pw"><h2>Lo que se buscó, lo que apareció y lo que no está</h2>
   <p class="intro">Un negativo verificado también es un resultado: dice dónde dejar de buscar.
   Estos salieron de abrir los registros originales y leerlos página por página, no de consultar
   índices de terceros.</p><div class="hall">`;
  ['hallazgo','negativo','hipotesis','muro','proximo'].forEach(tipo=>
    HALLAZGOS.filter(x=>x.tipo===tipo).forEach(x=>{
      h+=`<div class="h"><span class="et et-${tipo}">${nombre[tipo]}</span>
        <h3>${esc(x.t)}</h3><p>${esc(x.b)}</p></div>`;
    }));
  return h+'</div></div>';
}

/* ── conmutar vistas ── */
const pagina=document.getElementById('pagina');
let vista='arbol';
function irA(v){
  vista=v;
  document.querySelectorAll('#vistas button').forEach(b=>
    b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  const esArbol = v==='arbol';
  pagina.hidden=esArbol;
  document.getElementById('roots').style.display=esArbol?'':'none';
  if(!esArbol){
    pagina.innerHTML = v==='rutas' ? pintarRutas() : pintarHallazgos();
    pagina.scrollTop=0;
  }
}
document.querySelectorAll('#vistas button').forEach(b=>b.onclick=()=>irA(b.dataset.v));
</script>
